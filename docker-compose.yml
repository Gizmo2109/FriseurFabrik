# NEOS DEVELOPMENT ENVIRONMENT
#
# For instructions how to use docker-compose, see
# https://docs.neos.io/cms/installation-development-setup/docker-and-docker-compose-setup#docker-compose-cheat-sheet
services:
  # Neos CMS
  neos:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # run as the host user so files written by flow/composer stay editable on the host
    user: '1000:1000'
    environment:
      FLOW_CONTEXT: 'Development/Docker'
      COMPOSER_HOME: '/tmp/composer'
      # the PHP dev server is single threaded otherwise (thumbnails + Neos UI requests would queue up)
      PHP_CLI_SERVER_WORKERS: '8'
    volumes:
      # the whole project is mounted, so composer installs and Data/ (assets) persist on the host
      - ./:/app
    ports:
      - 8081:8081
    depends_on:
      - db
      - mailpit
  # catches all outgoing e-mails of the dev environment: web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - 8025:8025
  # DB
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: 'db'
    volumes:
      - db:/var/lib/mysql
    ports:
      - 13306:3306

volumes:
  db:
